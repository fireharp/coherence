    Manual validation covers the login policy story.
  docs/specs/auth.md: |
    # Auth spec

    The auth flow is governed by [US-001](../user-stories/US-001.md).
  internal/auth/auth.go: |
    package auth

    // Login implements US-001.
    func Login(score int) bool {
        return score >= 50
    }
