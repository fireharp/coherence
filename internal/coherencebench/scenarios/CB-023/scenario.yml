id: CB-023
name: code ahead of story doc needs truth clarification
description: |
  Baseline has US-001, supporting evidence, and Go code that claims to
  implement the story. Current changes the implementation semantics but
  leaves the user story doc untouched. The truth_alignment meter should
  emit an implementation_ahead clarification and promote the drift
  verdict to telemetry without deciding whether code or docs are right.
