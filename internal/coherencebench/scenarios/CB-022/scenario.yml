id: CB-022
name: consistent markdown change does not trigger contradiction
description: |
  Negative-case companion to CB-006. The staged change to
  `docs/specs/auth.md` rewords the spec but stays semantically
  aligned with `docs/decisions/ADR-007.md` (still mandates OAuth 2.0).
  The LLM contradiction pass should NOT emit `llm-contradiction`. Used
  to measure precision (no false positives) alongside CB-006's recall.
  Skipped at runtime when no GROQ_API_KEY is set.
mode: llm
base_files:
  ontology.yml: |
    version: 1
    rules: []
  docs/specs/auth.md: |
    # Authentication Spec

    The system authenticates users using **OAuth 2.0** with the
    authorization code + PKCE flow. Per
    [ADR-007](../decisions/ADR-007.md), Basic Auth is explicitly
    prohibited because it transmits credentials with every request.
  docs/decisions/ADR-007.md: |
    ---
    id: ADR-007
    ---
    # ADR-007: OAuth 2.0 mandate

    All user-facing authentication MUST use OAuth 2.0 with the
    authorization code + PKCE flow. Basic Auth is forbidden — it
    transmits credentials with every request and is incompatible with
    our token-rotation policy.
files:
  docs/specs/auth.md: |
    # Authentication Spec

    The system uses **OAuth 2.0** for user authentication, following
    the authorization code + PKCE flow as required by
    [ADR-007](../decisions/ADR-007.md). All token exchanges happen
    over TLS and the access token is rotated on every refresh.
expected:
  llm_fires: []
  blocking_error: false
