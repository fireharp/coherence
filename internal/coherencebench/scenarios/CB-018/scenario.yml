id: CB-018
name: single claim regression promotes verdict via claim_support diff
description: |
  Symmetric counterpart to CB-017 for the claim_support diff path.
  Baseline has three docs (no H1, so no concept nodes — isolating the
  claim_support meter from path_loss) each carrying one assertive
  bullet (`must A`, `must B`, `must C`) plus a markdown link to a
  decision doc whose `docs/evidence/<ADR>/` bucket auto-emits a
  `supports` edge. All three claims reach an evidence artifact via the
  typed-edge BFS.

  Current removes the single evidence file backing claim `must C`,
  dropping its only support path. Score = 1/3 ≈ 0.333, below
  claimSupportFloor (0.5). The diff list `NewlyUnsupportedClaims`
  contains exactly the claim that lost backing, and iteration 67's
  promotion path flips verdict from `clean` to `telemetry`.
status: deterministic
