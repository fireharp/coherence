version: 1
# Domain example: markdown knowledge-base with index files, source batches,
# and required frontmatter. Use this as a composition example — merge the
# rules you want into the ontology generated by a base template
# (typically `docs-site` or `generic`).

commands:
  test:
    - find content -name '*.md' -print | xargs -I{} grep -l '^---$' {} | wc -l
  build:
    - 'echo "kb build: regenerate index from content/ if your toolchain has one"'
  lint:
    - npx markdownlint 'content/**/*.md'

rules:
  - id: content-add-needs-index-entry
    when:
      - "content/**/*.md"
    expect_any:
      - "content/_index.md"
      - "content/index.md"
      - "content/README.md"
      - "content/**/_index.md"
    severity: warn
    message: "Content under content/ changed; verify the index/_index file still lists it."
    suggested_commands:
      - 'grep -F "$(basename ${file%.md})" content/_index.md content/index.md 2>/dev/null'

  - id: batch-checklist-needs-parent-index
    when:
      - "content/batches/*/*.md"
    expect_any:
      - "content/batches/_index.md"
      - "content/batches/README.md"
      - "content/_index.md"
    severity: warn
    message: "Batch entry changed; touch the batch index/checklist so traceability stays intact."
    suggested_commands:
      - ls content/batches/ | head -10

  - id: frontmatter-schema-change-needs-doc
    when:
      - "schemas/frontmatter.yml"
      - "schemas/frontmatter.yaml"
      - "schemas/frontmatter.json"
    expect_any:
      - "content/_index.md"
      - "docs/schema/**/*.md"
      - "README.md"
    severity: error
    message: "Frontmatter schema changed; document the new required fields and re-validate content."
    suggested_commands:
      - 'find content -name "*.md" -print0 | xargs -0 head -20 | grep -c "^---"'
